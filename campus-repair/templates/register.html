{% extends 'base.html' %}{% block title %}สมัครสมาชิก{% endblock %}{% block content %}<section class="auth-card surface"><span class="eyebrow">เริ่มต้นใช้งาน</span><h1>สมัครสมาชิก</h1><p class="text-secondary">สร้างบัญชีสำหรับแจ้งซ่อมและติดตามรายการของคุณ</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label" for="name">ชื่อ–นามสกุล</label><input id="name" class="form-control mb-3" name="name" required minlength="2" maxlength="100" autocomplete="name" value="{{ request.form.get('name', '') }}"><label class="form-label" for="username">ชื่อผู้ใช้</label><input id="username" class="form-control" name="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_.\-]{3,40}" autocomplete="username" value="{{ request.form.get('username', '') }}"><div class="form-text mb-3">ภาษาอังกฤษ ตัวเลข หรือ _ . - จำนวน 3–40 ตัว</div><label class="form-label" for="password">รหัสผ่าน</label><input id="password" class="form-control" name="password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><div class="form-text mb-3">ใช้รหัสผ่าน 10–128 ตัวอักษร</div><label class="form-label" for="confirm_password">ยืนยันรหัสผ่าน</label><input id="confirm_password" class="form-control mb-4" name="confirm_password" type="password" required minlength="10" maxlength="128" autocomplete="new-password"><button class="btn btn-primary w-100">สร้างบัญชี</button></form><p class="mt-4 mb-0 text-center">มีบัญชีแล้ว? <a href="{{ url_for('login') }}">เข้าสู่ระบบ</a></p></section>{% endblock %}
