{% extends 'base.html' %}{% block title %}แจ้งซ่อมอุปกรณ์{% endblock %}{% block content %}<div class="page-heading"><div><span class="eyebrow">รายการใหม่</span><h1>แจ้งซ่อมอุปกรณ์</h1><p>อธิบายปัญหาให้ชัดเจน เพื่อให้เจ้าหน้าที่ช่วยคุณได้เร็วขึ้น</p></div><a href="{{ url_for('my_repairs') }}" class="btn btn-outline-primary">กลับรายการของฉัน</a></div><section class="surface form-panel"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label for="equipment" class="form-label">อุปกรณ์ / รหัสครุภัณฑ์</label><input id="equipment" class="form-control" name="equipment" required minlength="2" maxlength="100" placeholder="เช่น คอมพิวเตอร์ PC-001" value="{{ request.form.get('equipment', '') }}"></div><div class="col-md-6"><label for="room" class="form-label">ห้อง / สถานที่</label><input id="room" class="form-control" name="room" required maxlength="100" placeholder="เช่น อาคาร 2 ห้องคอมพิวเตอร์ 201" value="{{ request.form.get('room', '') }}"></div><div class="col-12"><label for="description" class="form-label">รายละเอียดอาการที่พบ</label><textarea id="description" class="form-control" name="description" rows="5" required minlength="10" maxlength="2000" placeholder="เกิดปัญหาอะไร เริ่มพบเมื่อใด และได้ลองแก้ไขอย่างไรแล้ว">{{ request.form.get('description', '') }}</textarea><div class="form-text">10–2,000 ตัวอักษร</div></div><div class="col-12"><label for="contact" class="form-label">ข้อมูลติดต่อ</label><input id="contact" class="form-control" name="contact" required minlength="5" maxlength="200" placeholder="เบอร์โทร หรือช่องทางติดต่อที่สะดวก" value="{{ request.form.get('contact', '') }}"><div class="form-text">เห็นได้เฉพาะคุณและผู้ดูแลระบบ</div></div></div><button class="btn btn-primary mt-4">ส่งรายการแจ้งซ่อม →</button></form></section>{% endblock %}
