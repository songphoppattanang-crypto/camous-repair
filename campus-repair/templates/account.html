{# หน้าบัญชี: เพิ่มอีเมลให้สมาชิกเดิมและแก้ข้อมูลส่วนตัว #}
{% extends 'base.html' %}{% block title %}ข้อมูลบัญชี{% endblock %}{% block content %}<section class="auth-card surface"><h1>ข้อมูลบัญชี</h1><p>บัญชี: {{ g.user.username }}</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% include '_profile_fields.html' %}<button class="btn btn-primary w-100">บันทึกข้อมูล</button></form></section>
<section class="auth-card surface mt-4"><h2>เปลี่ยนรหัสผ่าน</h2><form method="post" action="{{ url_for('change_password') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="current-password" class="form-label">รหัสผ่านเดิม</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" class="form-control mb-3" required maxlength="128"><label for="new-password" class="form-label">รหัสผ่านใหม่</label><input id="new-password" name="password" type="password" autocomplete="new-password" class="form-control mb-3" required minlength="10" maxlength="128"><label for="confirm-password" class="form-label">ยืนยันรหัสผ่านใหม่</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" class="form-control mb-3" required minlength="10" maxlength="128"><button class="btn btn-primary w-100">เปลี่ยนรหัสผ่าน</button></form></section>{% endblock %}
