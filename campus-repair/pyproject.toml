[project]
name = "campus-repair"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.2",
  "Flask-WTF==1.2.2",
  "Werkzeug==3.1.3",
  "Jinja2==3.1.6",
  "MarkupSafe==3.0.3",
  "itsdangerous==2.2.0",
  "click==8.1.8",
  "blinker==1.9.0",
  "WTForms==3.2.1",
  "colorama==0.4.6",
  "psycopg[binary]==3.2.13",
]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python build.py"
